name: Retag — Single GHCR image

on:
  workflow_call:
    inputs:
      image:
        description: |
          Image name under ghcr.io/<owner>/ (e.g. "chillpass"). Lowercased automatically.
          Combined with the resolved owner to form the full reference ghcr.io/<owner>/<image>.
        type: string
        required: true
      source-tag:
        description: |
          Existing tag on the image to retag from (e.g. "sha-abc1234"). The image must already
          exist at ghcr.io/<owner>/<image>:<source-tag>; this workflow does NOT rebuild or push
          new content. Manifest digests are preserved across the retag (verifiable via crane).
        type: string
        required: true
      dest-tags:
        description: |
          Newline-separated list of destination tags to point at the same manifest digest as
          source-tag (e.g. "v1.2.3\nlatest"). Empty lines are skipped.
        type: string
        required: true
      registry:
        description: Container registry hostname. Must be ghcr.io because this workflow authenticates with GITHUB_TOKEN.
        type: string
        required: false
        default: ghcr.io
      owner:
        description: |
          Registry namespace owner. Defaults to the repository owner of the calling workflow
          (lowercased). Override only if retagging into a different namespace.
        type: string
        required: false
        default: ""
    outputs:
      source-digest:
        description: sha256 manifest digest of the source-tag (post-retag, identical to dest digests).
        value: ${{ jobs.retag.outputs.source-digest }}
      dest-digests:
        description: |
          JSON array of objects { "tag": "<dest-tag>", "digest": "sha256:..." } for each dest tag.
          All entries should equal source-digest — emitted explicitly so callers can assert
          byte-identical manifest copies (no rebuild).
        value: ${{ jobs.retag.outputs.dest-digests }}

jobs:
  resolve-runner:
    uses: kethalia/workflows/.github/workflows/resolve-runner.yml@v3.2.0

  retag:
    name: Retag ${{ inputs.image }} (${{ inputs.source-tag }})
    runs-on: ${{ needs.resolve-runner.outputs.light }}
    needs: [resolve-runner]
    permissions:
      contents: read
      packages: write
    outputs:
      source-digest: ${{ steps.verify.outputs.source-digest }}
      dest-digests: ${{ steps.verify.outputs.dest-digests }}
    steps:
      - name: Resolve owner + image reference
        id: ref
        env:
          INPUT_OWNER: ${{ inputs.owner }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_REGISTRY: ${{ inputs.registry }}
        run: |
          set -euo pipefail
          owner="${INPUT_OWNER:-${GITHUB_REPOSITORY_OWNER}}"
          owner="${owner,,}"
          image="${INPUT_IMAGE}"
          image="${image,,}"
          registry="${INPUT_REGISTRY}"
          if [ "${registry}" != "ghcr.io" ]; then
            echo "::error::retag-image.yml supports only ghcr.io when authenticating with GITHUB_TOKEN; got ${registry}" >&2
            exit 1
          fi
          if [[ ! "${owner}" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "::error::Invalid GHCR owner namespace: ${owner}" >&2
            exit 1
          fi
          if [[ ! "${image}" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]]; then
            echo "::error::Invalid GHCR image name: ${image}" >&2
            exit 1
          fi
          ref="${registry}/${owner}/${image}"
          printf 'owner=%s\n' "${owner}" >> "$GITHUB_OUTPUT"
          printf 'image=%s\n' "${image}" >> "$GITHUB_OUTPUT"
          printf 'registry=%s\n' "${registry}" >> "$GITHUB_OUTPUT"
          printf 'ref=%s\n' "${ref}" >> "$GITHUB_OUTPUT"
          echo "Resolved image reference: ${ref}"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        env:
          CRANE_VERSION: v0.21.6
        run: |
          set -euo pipefail

          os="${RUNNER_OS}"
          if [ "${os}" = "macOS" ]; then
            os="Darwin"
          fi

          raw_arch="$(uname -m)"
          case "${raw_arch}" in
            x86_64 | amd64)
              arch="x86_64"
              ;;
            aarch64 | arm64)
              arch="arm64"
              ;;
            *)
              echo "::error::Unsupported crane install architecture: ${raw_arch}" >&2
              exit 1
              ;;
          esac

          out="crane"
          if [ "${os}" = "Windows" ]; then
            out="crane.exe"
          fi

          archive="go-containerregistry_${os}_${arch}.tar.gz"
          case "${archive}" in
            go-containerregistry_Darwin_arm64.tar.gz)
              expected_sha="a124f297d1e63e8b6c63c2463e43565290d2fd074c1dadb5ca73d737bc7b2484"
              ;;
            go-containerregistry_Darwin_x86_64.tar.gz)
              expected_sha="f1e653737a1d6e8a412734d0ac25009e04eccec98853be2eb59b8c744dede834"
              ;;
            go-containerregistry_Linux_arm64.tar.gz)
              expected_sha="6f61571ca0c2a5da27c2927fcb143255ccb2b74b8977dfcb44645b372ab0f951"
              ;;
            go-containerregistry_Linux_x86_64.tar.gz)
              expected_sha="7ebbdcd05b652345c1f5105f8475e518534b90d66f3bdb50017be63f426ea435"
              ;;
            go-containerregistry_Windows_arm64.tar.gz)
              expected_sha="f0a8f5f60c9b7a52265d84b928a6cbba8fda6d7ae32bd98f5d91ee745f6b4e9b"
              ;;
            go-containerregistry_Windows_x86_64.tar.gz)
              expected_sha="fb78f814f68ab47266458f319ca7e642a303453ea25c8993a14eb9850c56e870"
              ;;
            *)
              echo "::error::Unsupported crane install target: ${archive}" >&2
              exit 1
              ;;
          esac

          release_url="https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}"
          tmp="$(mktemp -d)"
          bin_dir="${RUNNER_TEMP}/crane-${CRANE_VERSION}"
          mkdir -p "${bin_dir}"
          trap 'rm -rf "${tmp}"' EXIT

          curl -fsSL "${release_url}/${archive}" -o "${tmp}/${archive}"
          if command -v sha256sum >/dev/null 2>&1; then
            actual_sha="$(sha256sum "${tmp}/${archive}" | awk '{print $1}')"
          else
            actual_sha="$(shasum -a 256 "${tmp}/${archive}" | awk '{print $1}')"
          fi
          if [ "${actual_sha}" != "${expected_sha}" ]; then
            echo "::error::Checksum mismatch for ${archive}: expected ${expected_sha}, got ${actual_sha}" >&2
            exit 1
          fi

          tar -xzf "${tmp}/${archive}" -C "${bin_dir}" "${out}"
          chmod +x "${bin_dir}/${out}"
          if [ "${out}" != "crane" ]; then
            cp "${bin_dir}/${out}" "${bin_dir}/crane"
          fi
          echo "${bin_dir}" >> "${GITHUB_PATH}"
          "${bin_dir}/crane" version

      - name: Log in to ghcr.io for crane
        env:
          REGISTRY: ghcr.io
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${REGISTRY_PASSWORD}" | crane auth login "${REGISTRY}" --username "${REGISTRY_USERNAME}" --password-stdin

      - name: Retag via buildx imagetools (no rebuild)
        id: retag
        env:
          REF: ${{ steps.ref.outputs.ref }}
          SOURCE_TAG: ${{ inputs.source-tag }}
          DEST_TAGS: ${{ inputs.dest-tags }}
        run: |
          set -euo pipefail
          src="${REF}:${SOURCE_TAG}"
          echo "Source: ${src}"
          # Validate source exists before mutating anything.
          if ! crane manifest "${src}" >/dev/null 2>&1; then
            echo "::error::Source image ${src} does not exist in registry" >&2
            exit 1
          fi
          # Iterate dest tags (newline-separated).
          while IFS= read -r raw; do
            dest="$(echo "$raw" | tr -d '[:space:]')"
            [ -z "$dest" ] && continue
            target="${REF}:${dest}"
            echo "::group::Retag -> ${target}"
            docker buildx imagetools create --tag "${target}" "${src}"
            echo "::endgroup::"
          done <<<"${DEST_TAGS}"

      - name: Verify digest equality
        id: verify
        env:
          REF: ${{ steps.ref.outputs.ref }}
          SOURCE_TAG: ${{ inputs.source-tag }}
          DEST_TAGS: ${{ inputs.dest-tags }}
        run: |
          set -euo pipefail
          src_digest="$(crane digest "${REF}:${SOURCE_TAG}")"
          echo "source-digest=${src_digest}" >> "$GITHUB_OUTPUT"
          echo "Source digest: ${src_digest}"
          mismatch=0
          dest_json='[]'
          {
            echo "## Retag verification — \`${REF}\`"
            echo
            echo "| tag | digest | match |"
            echo "| --- | --- | --- |"
            echo "| \`${SOURCE_TAG}\` (source) | \`${src_digest}\` | — |"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r raw; do
            dest="$(echo "$raw" | tr -d '[:space:]')"
            [ -z "$dest" ] && continue
            d="$(crane digest "${REF}:${dest}")"
            mark="✅"
            if [ "$d" != "$src_digest" ]; then
              mark="❌"
              mismatch=1
            fi
            echo "| \`${dest}\` | \`${d}\` | ${mark} |" >> "$GITHUB_STEP_SUMMARY"
            dest_json="$(jq -c --arg t "$dest" --arg d "$d" '. + [{tag:$t,digest:$d}]' <<<"$dest_json")"
          done <<<"${DEST_TAGS}"
          echo "dest-digests=${dest_json}" >> "$GITHUB_OUTPUT"
          if [ "$mismatch" = "1" ]; then
            echo "::error::One or more destination tags do not match the source digest (rebuild detected)." >&2
            exit 1
          fi
