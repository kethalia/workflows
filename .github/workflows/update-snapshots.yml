name: Reusable — Update Visual Snapshots (Dispatcher)

# Reusable dispatcher for the `/update-snapshots` PR-comment workflow.
#
# Industry-standard human-in-the-loop pattern (mirrors Chromatic / Percy /
# Argos): when a visual-tests run fails on an intentional UI change, a
# maintainer comments `/update-snapshots` on the PR. The caller workflow
# (which owns the `issue_comment` trigger — `issue_comment` is not a valid
# `workflow_call` event) delegates the actual dispatch logic to this
# reusable workflow.
#
# This reusable:
#   1. verifies the commenter has write access to the repo,
#   2. reacts to the comment with 👀,
#   3. resolves the PR head branch via the API and refuses fork PRs
#      (workflow_dispatch can only target branches in the same repo),
#   4. dispatches the target workflow (default: `reusable-visual-tests.yml`) on that
#      branch, passing `update-baselines=true` as a workflow input,
#   5. posts a follow-up comment linking to the dispatched run.
#
# Trust boundary: `issue_comment` always loads workflows from the default
# branch, never the PR HEAD. The permission check is the auth gate.
#
# Required caller permissions (this reusable does NOT declare a job-level
# `permissions:` block — a reusable's job permissions cap what the caller can
# grant, never elevate it, so the caller must grant these scopes at
# workflow-level or on the calling job):
#
#   permissions:
#     pull-requests: write   # PR-context comment reactions + dispatch follow-up
#                            #   (issue_comment on PRs routes through the
#                            #   pull-requests scope, despite the URL shape;
#                            #   `issues: write` alone is not sufficient)
#     actions: write         # gh workflow run (dispatch the target workflow)
#     contents: read         # actions/github-script + gh CLI base scope
#
# Note: `contents: write` is NOT required by THIS reusable — the dispatched
# target workflow (e.g. reusable-visual-tests.yml) is what pushes refreshed baselines
# back to the PR branch, and that workflow declares its own permissions.
#
# Without these grants (workflow- or job-level on the caller), the reaction /
# dispatch / comment steps will 403 silently on repos where the org or repo
# default scopes the `GITHUB_TOKEN` to read-only.

on:
  workflow_call:
    inputs:
      target-workflow:
        description: |
          Workflow file (basename) to dispatch on the PR head branch. Must
          declare a `workflow_dispatch` trigger and accept the input named
          by `dispatch-input-name`.
        type: string
        required: false
        default: visual-tests.yml
      dispatch-input-name:
        description: |
          Name of the boolean `workflow_dispatch` input to set to `true`
          on the dispatched run. Must match the input declared by the
          target workflow.
        type: string
        required: false
        default: update-baselines
      trigger-phrase:
        description: |
          Comment prefix that authorizes a dispatch. The reusable re-checks
          this prefix as a defense-in-depth guard so the caller's `if:`
          filter and the reusable's behavior stay in sync.
        type: string
        required: false
        default: /update-snapshots
      allowed-permissions:
        description: |
          Comma-separated repo permission levels allowed to trigger a
          dispatch. Default covers maintainers/admins/write collaborators.
        type: string
        required: false
        default: admin,write,maintain
      confirmation-message:
        description: |
          Markdown body for the follow-up confirmation comment. Supports
          two placeholders: `{ref}` (PR head branch) and `{runs_url}`
          (URL of the target workflow's run list).
        type: string
        required: false
        default: "🔄 Dispatched baseline refresh on `{ref}`. Watch the run at {runs_url}. New baselines will be committed back to this PR if any pixels changed."

jobs:
  resolve-runner:
    uses: kethalia/workflows/.github/workflows/resolve-runner.yml@v3.1.0

  dispatch:
    needs: [resolve-runner]
    # Resolution follows `resolve-runner.yml` — `vars.RUNNER_HEAVY` on the
    # caller repo (or org-level default) selects the label; falls back to
    # `self-hosted`. Pinned to the heavy tier to match `reusable-visual-tests.yml`
    # so dispatcher and dispatched run land on the same runner pool.
    runs-on: ${{ needs.resolve-runner.outputs.heavy }}
    # NOTE: no job-level `permissions:` block by design — see header doc.
    # The caller (workflow- or job-level) must grant: pull-requests: write, actions: write, contents: read.
    steps:
      - name: Guard on trigger phrase
        env:
          TRIGGER_PHRASE: ${{ inputs.trigger-phrase }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          case "$COMMENT_BODY" in
            "$TRIGGER_PHRASE"*)
              echo "Comment matches trigger phrase '$TRIGGER_PHRASE'."
              ;;
            *)
              echo "::error::Comment does not start with configured trigger-phrase '$TRIGGER_PHRASE'. Caller's \`if:\` filter must match the \`trigger-phrase\` input."
              exit 1
              ;;
          esac

      - name: Check commenter permission
        uses: actions/github-script@v7
        env:
          ALLOWED: ${{ inputs.allowed-permissions }}
        with:
          script: |
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login,
            });
            const allowed = process.env.ALLOWED.split(',').map(s => s.trim());
            if (!allowed.includes(perm.permission)) {
              core.setFailed(`@${context.payload.comment.user.login} lacks repo permission to refresh baselines (got: ${perm.permission}; allowed: ${allowed.join(', ')}).`);
            }

      - name: React to comment (eyes)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - name: Resolve PR head ref
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Refuse fork PRs: workflow_dispatch requires a branch in this repo.
          ref=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json headRefName,headRepositoryOwner \
            --jq "if .headRepositoryOwner.login == \"$REPO_OWNER\" then .headRefName else empty end")
          if [ -z "$ref" ]; then
            echo "::error::PR head is on a fork; workflow_dispatch requires a branch in this repo."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Dispatch target workflow on PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.pr.outputs.ref }}
          TARGET_WORKFLOW: ${{ inputs.target-workflow }}
          INPUT_NAME: ${{ inputs.dispatch-input-name }}
        run: |
          set -euo pipefail
          gh workflow run "$TARGET_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$REF" \
            -f "${INPUT_NAME}=true"

      - name: Comment with dispatch confirmation
        uses: actions/github-script@v7
        env:
          REF: ${{ steps.pr.outputs.ref }}
          TARGET_WORKFLOW: ${{ inputs.target-workflow }}
          TEMPLATE: ${{ inputs.confirmation-message }}
        with:
          script: |
            const ref = process.env.REF;
            const workflow = process.env.TARGET_WORKFLOW;
            const runsUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/${workflow}`;
            const body = process.env.TEMPLATE
              .replace(/\{ref\}/g, ref)
              .replace(/\{runs_url\}/g, runsUrl);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });
