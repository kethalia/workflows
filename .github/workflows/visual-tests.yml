name: Reusable — Visual Regression Tests

# Reusable workflow that runs Playwright-based visual regression tests inside
# the pinned `mcr.microsoft.com/playwright` container, with a peer `label-gate`
# job that fails closed when committed baseline screenshots change without an
# approval label on the PR.
#
# Topology: `visual-tests` runs the suite; `label-gate` runs on `pull_request`
# events and diffs against the base branch. Both are intended as required
# branch-protection checks.

on:
  workflow_call:
    inputs:
      playwright-image:
        description: Container image to run the suite in (Playwright official image recommended). Must include bash — the reusable pins `defaults.run.shell: bash` so strict-mode prologues (`set -o pipefail`) work uniformly across steps.
        type: string
        required: false
        default: mcr.microsoft.com/playwright
      playwright-image-tag:
        description: |
          Image tag matching the @playwright/test version the repo uses
          (e.g. "v1.56.0-jammy"). Mismatching the SDK and image tag silently
          drifts renders — keep them in lockstep.
        type: string
        required: true
      browsers-path:
        description: |
          PLAYWRIGHT_BROWSERS_PATH for the image. The official Playwright
          containers ship browsers under /ms-playwright; override only if a
          custom image stores them elsewhere.
        type: string
        required: false
        default: /ms-playwright
      pnpm-version:
        description: pnpm version to activate via corepack.
        type: string
        required: false
        default: 9.15.9
      install-command:
        description: Dependency install command.
        type: string
        required: false
        default: pnpm install --frozen-lockfile
      test-command:
        description: |
          Command that runs the visual regression suite. Should produce an
          HTML report at the path under `report-paths` so the failure
          artifact upload has something to capture.
        type: string
        required: true
      report-paths:
        description: |
          Newline-separated paths to upload on failure (Playwright HTML report
          plus the per-test-results dir). Use the same multiline format
          `actions/upload-artifact` accepts. Paths are project-specific; the
          caller must supply them.
        type: string
        required: true
      screenshots-path:
        description: |
          Path (relative to repo root) where committed baseline PNGs live.
          The label-gate job diffs this directory against the PR base branch.
        type: string
        required: false
        default: packages/visual-tests/src/__screenshots__/
      approval-label:
        description: Label that must be present on the PR for baseline diffs to land.
        type: string
        required: false
        default: baselines:approved
      timeout-minutes:
        description: Per-job timeout for the visual-tests run.
        type: number
        required: false
        default: 30
      artifact-retention-days:
        description: Retention for the failure-artifact upload.
        type: number
        required: false
        default: 14
      update-baselines:
        description: |
          When true, run `update-command` instead of `test-command`, then
          commit any regenerated files under `screenshots-path` back to the
          source branch. The `label-gate` job is skipped in this mode since
          the entire point of the run is to produce baseline changes.

          Intended to be wired to a `workflow_dispatch` trigger in the caller
          so a maintainer can refresh baselines from the same container CI
          uses for verification — eliminating local/CI environment drift.
        type: boolean
        required: false
        default: false
      update-command:
        description: |
          Command that regenerates baseline screenshots (e.g. one that adds
          `--update-snapshots` to the Playwright run). Required when
          `update-baselines` is true; ignored otherwise.
        type: string
        required: false
        default: ''
      update-commit-message:
        description: Commit message used when `update-baselines` produces changes.
        type: string
        required: false
        default: "chore(visual-tests): refresh baselines from CI"
      git-user-name:
        description: Git committer name used for the baseline-update commit.
        type: string
        required: false
        default: github-actions[bot]
      git-user-email:
        description: Git committer email used for the baseline-update commit.
        type: string
        required: false
        default: 41898282+github-actions[bot]@users.noreply.github.com

concurrency:
  group: visual-tests-${{ github.workflow }}-${{ github.ref }}
  # Do not cancel in-flight runs when updating baselines — the run pushes a
  # new commit that would otherwise interrupt itself.
  cancel-in-progress: ${{ !inputs.update-baselines }}

jobs:
  visual-tests:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # No `permissions:` block here. GitHub Actions does NOT evaluate
    # expressions in `jobs.<id>.permissions`, and declaring a static
    # `contents: write` on a reusable would exceed the token scope of
    # test-only callers that grant only `contents: read`, producing a
    # startup_failure. Callers that need `update-baselines: true` must
    # grant `contents: write` on the calling job (or workflow)
    # `permissions:` — the reusable then inherits that elevated scope.
    container:
      image: ${{ inputs.playwright-image }}:${{ inputs.playwright-image-tag }}
      options: --ipc=host
    # The default container shell is `sh` (dash), which rejects `set -o pipefail`.
    # Pin every inline step to bash so the strict-mode prologue works uniformly.
    # The playwright-jammy image ships bash.
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ inputs.browsers-path }}
    steps:
      - name: Validate inputs
        if: inputs.update-baselines && inputs.update-command == ''
        run: |
          echo "::error::update-baselines=true requires update-command to be set."
          exit 1

      - name: Guard refresh-mode ref is a branch
        if: inputs.update-baselines
        env:
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # In refresh mode we push a commit back; that requires a real branch
          # ref. workflow_dispatch against a tag (or any non-branch ref with no
          # head_ref) produces a detached HEAD that `git push` cannot resolve.
          if [ -n "${HEAD_REF}" ]; then
            echo "refresh target: ${HEAD_REF} (PR head)"
            exit 0
          fi
          case "${REF}" in
            refs/heads/*)
              echo "refresh target: ${REF}"
              ;;
            *)
              echo "::error::update-baselines requires a branch ref. Got '${REF}'."
              echo "Trigger this workflow from a branch (workflow_dispatch on a branch, or pull_request)."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out the actual branch tip (not the detached merge SHA) so
          # the baseline-refresh commit can be pushed back.
          ref: ${{ inputs.update-baselines && (github.head_ref || github.ref_name) || github.ref }}

      - name: Enable corepack and activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ inputs.pnpm-version }} --activate

      - name: Compute pnpm store directory
        id: pnpm-cache
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Run visual tests
        if: ${{ !inputs.update-baselines }}
        run: ${{ inputs.test-command }}

      - name: Refresh visual baselines
        if: inputs.update-baselines
        run: ${{ inputs.update-command }}

      - name: Commit refreshed baselines
        if: inputs.update-baselines
        env:
          SCREENSHOTS_PATH: ${{ inputs.screenshots-path }}
          COMMIT_MESSAGE: ${{ inputs.update-commit-message }}
          GIT_USER_NAME: ${{ inputs.git-user-name }}
          GIT_USER_EMAIL: ${{ inputs.git-user-email }}
        run: |
          set -euo pipefail
          # `actions/checkout` marks the workspace as unsafe for `git` when
          # run inside a container with a different uid than the repo owner.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "${GIT_USER_NAME}"
          git config user.email "${GIT_USER_EMAIL}"
          # -A so deleted/renamed baselines are staged too — otherwise stale
          # PNGs would accumulate after a component is removed or renamed.
          git add -A -- "${SCREENSHOTS_PATH}"
          if git diff --cached --quiet; then
            echo "No baseline changes — branch already in sync with CI renders."
            exit 0
          fi
          git commit -m "${COMMIT_MESSAGE}"
          git push

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ inputs.report-paths }}
          retention-days: ${{ inputs.artifact-retention-days }}
          compression-level: 6
          if-no-files-found: ignore

  label-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !inputs.update-baselines
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect screenshot changes
        id: detect
        env:
          BASE_REF: ${{ github.base_ref }}
          SCREENSHOTS_PATH: ${{ inputs.screenshots-path }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "origin/${BASE_REF}...HEAD" -- "${SCREENSHOTS_PATH}" || true)
          if [ -n "$CHANGED" ]; then
            echo "Screenshot baseline changes detected:"
            echo "$CHANGED"
            {
              echo 'changed<<EOF'
              echo "$CHANGED"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "No screenshot baseline changes."
            echo 'changed=' >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce approval label on screenshot changes
        env:
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, inputs.approval-label) }}
          CHANGED: ${{ steps.detect.outputs.changed }}
          APPROVAL_LABEL: ${{ inputs.approval-label }}
          SCREENSHOTS_PATH: ${{ inputs.screenshots-path }}
        run: |
          set -euo pipefail
          if [ -n "$CHANGED" ] && [ "$HAS_LABEL" = "false" ]; then
            echo "::error::Unlabeled screenshot baseline change detected."
            echo "The following files under ${SCREENSHOTS_PATH} changed:"
            echo "$CHANGED"
            echo ""
            echo "Remediation: a maintainer must apply the '${APPROVAL_LABEL}' label to this PR"
            echo "after reviewing the baseline diff."
            exit 1
          fi
          echo "label-gate OK"
