name: CI — Helm Lint & Template

on:
  workflow_call:
    inputs:
      charts:
        description: Newline-separated list of chart paths (relative to caller repo root)
        type: string
        required: true
      helm-version:
        description: Helm version to install via azure/setup-helm
        type: string
        required: false
        default: v3.16.2
      strict:
        description: Pass --strict to helm lint
        type: boolean
        required: false
        default: true
      validate-templates:
        description: |
          When true, validate the rendered templates with kubeconform after
          `helm template`. Requires `kubernetes-version` to target a specific
          API set. Useful for charts that ship pure k8s manifests (no CRDs
          beyond well-known ones).
        type: boolean
        required: false
        default: false
      kubernetes-version:
        description: |
          Kubernetes API version passed to kubeconform (-kubernetes-version).
          Only applies when `validate-templates` is true.
        type: string
        required: false
        default: "1.30.0"
      kubeconform-version:
        description: kubeconform release tag (e.g., v0.6.7)
        type: string
        required: false
        default: v0.6.7
      runs-on:
        description: |
          Runner label for the lint matrix jobs. When empty, falls back to the
          tiered resolver (`vars.RUNNER_HEAVY` → default `self-hosted`). Pass
          a value to force a specific runner.
        type: string
        required: false
        default: ""

jobs:
  resolve-runner:
    uses: kethalia/workflows/.github/workflows/resolve-runner.yml@v3.0.0

  # -------------------------------------------------------------------------
  # Setup — split newline-separated charts input into JSON matrix
  # -------------------------------------------------------------------------
  setup:
    name: Setup Matrix
    runs-on: ${{ needs.resolve-runner.outputs.light }}
    needs: [resolve-runner]
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - id: build-matrix
        name: Build chart matrix
        env:
          CHARTS_INPUT: ${{ inputs.charts }}
        run: |
          # Split newline-separated input, drop blanks, emit JSON array
          mapfile -t charts < <(printf '%s\n' "$CHARTS_INPUT" | sed 's/[[:space:]]\+$//' | grep -v '^[[:space:]]*$')
          if [ "${#charts[@]}" -eq 0 ]; then
            echo "::error::No chart paths provided in 'charts' input"
            exit 1
          fi
          json="["
          for i in "${!charts[@]}"; do
            [ "$i" -gt 0 ] && json+=","
            json+=$(printf '%s' "${charts[$i]}" | jq -Rs .)
          done
          json+="]"
          echo "matrix=${json}" >> "$GITHUB_OUTPUT"
          echo "Resolved chart matrix: ${json}"

  # -------------------------------------------------------------------------
  # Lint + template each chart in parallel; fail-fast disabled so all charts
  # report independently and reviewers see every failure in one CI pass.
  # -------------------------------------------------------------------------
  lint:
    name: Helm Lint (${{ matrix.chart }})
    needs: [resolve-runner, setup]
    runs-on: ${{ inputs.runs-on != '' && inputs.runs-on || needs.resolve-runner.outputs.heavy }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ inputs.helm-version }}

      - name: Verify chart path exists
        run: |
          if [ ! -d "${{ matrix.chart }}" ]; then
            echo "::error::Chart path '${{ matrix.chart }}' does not exist in caller repo"
            exit 1
          fi
          if [ ! -f "${{ matrix.chart }}/Chart.yaml" ]; then
            echo "::error::No Chart.yaml at '${{ matrix.chart }}'"
            exit 1
          fi

      - name: Helm dependency update
        working-directory: ${{ matrix.chart }}
        run: helm dependency update

      - name: Helm lint
        working-directory: ${{ matrix.chart }}
        run: |
          if [ "${{ inputs.strict }}" = "true" ]; then
            helm lint --strict .
          else
            helm lint .
          fi

      - name: Helm template (render)
        run: |
          mkdir -p .helm-render
          chart_name=$(basename "${{ matrix.chart }}")
          helm template "$chart_name" "${{ matrix.chart }}" > ".helm-render/${chart_name}.yaml"
          echo "Rendered $(wc -l < ".helm-render/${chart_name}.yaml") lines for ${chart_name}"

      - name: Install kubeconform
        if: ${{ inputs.validate-templates }}
        env:
          KUBECONFORM_VERSION: ${{ inputs.kubeconform-version }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)   os=linux ;;
            macOS)   os=darwin ;;
            Windows) echo "kubeconform install on Windows runners is not supported by this reusable" >&2; exit 1 ;;
            *) echo "Unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
          esac
          case "$RUNNER_ARCH" in
            X64)   arch=amd64 ;;
            ARM64) arch=arm64 ;;
            *) echo "Unsupported runner arch: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          asset="kubeconform-${os}-${arch}.tar.gz"
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          tmp=$(mktemp -d)
          curl -fsSL -o "$tmp/$asset" "$base/$asset"
          curl -fsSL -o "$tmp/CHECKSUMS" "$base/CHECKSUMS"
          ( cd "$tmp" && grep " $asset\$" CHECKSUMS | sha256sum -c - )
          tar xz -C "$tmp" -f "$tmp/$asset" kubeconform
          sudo install -m 0755 "$tmp/kubeconform" /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate rendered templates (kubeconform)
        if: ${{ inputs.validate-templates }}
        env:
          K8S_VERSION: ${{ inputs.kubernetes-version }}
        run: |
          set -euo pipefail
          chart_name=$(basename "${{ matrix.chart }}")
          kubeconform \
            -kubernetes-version "$K8S_VERSION" \
            -strict \
            -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            ".helm-render/${chart_name}.yaml"

      - name: Compute artifact name
        id: artifact-name
        run: |
          # Replace path separators with dashes so artifact names are valid
          safe_name=$(printf '%s' "${{ matrix.chart }}" | tr '/' '-' | tr -cd '[:alnum:]-_.')
          echo "name=helm-render-${safe_name}" >> "$GITHUB_OUTPUT"

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: .helm-render/
          retention-days: 7
