name: CI — Helm Lint & Template

on:
  workflow_call:
    inputs:
      charts:
        description: |
          Newline-separated list of chart paths (relative to caller repo root).
          Either `charts` or `chart-discovery-command` must be provided. When
          both are set, `charts` wins and discovery is skipped.
        type: string
        required: false
        default: ""
      chart-discovery-command:
        description: |
          Optional bash command that prints newline-separated chart paths to
          stdout. Lines ending in `/Chart.yaml` are reduced to their parent
          directory; other lines are treated as chart directories as-is.
          Useful when chart layout is dynamic (e.g. `find infrastructure -name
          Chart.yaml -not -path '*/charts/*'`). Ignored when `charts` is set.
        type: string
        required: false
        default: ""
      kubeconform-schema-locations:
        description: |
          Newline-separated list of `-schema-location` arguments passed to
          kubeconform when `validate-templates` is true. Defaults to
          `default` + the datreeio CRDs catalog. Provide your own values
          (one per line) to override — pass `default` explicitly if you
          still want the bundled k8s schemas alongside custom CRD sources.
        type: string
        required: false
        default: |
          default
          https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
      helm-version:
        description: Helm version to install via azure/setup-helm
        type: string
        required: false
        default: v3.16.2
      strict:
        description: Pass --strict to helm lint
        type: boolean
        required: false
        default: true
      validate-templates:
        description: |
          When true, validate the rendered templates with kubeconform after
          `helm template`. Requires `kubernetes-version` to target a specific
          API set. Useful for charts that ship pure k8s manifests (no CRDs
          beyond well-known ones).
        type: boolean
        required: false
        default: false
      kubernetes-version:
        description: |
          Kubernetes API version passed to kubeconform (-kubernetes-version).
          Only applies when `validate-templates` is true.
        type: string
        required: false
        default: "1.30.0"
      kubeconform-version:
        description: kubeconform release tag (e.g., v0.6.7)
        type: string
        required: false
        default: v0.6.7
      runs-on:
        description: |
          Runner label for the lint matrix jobs. When empty, falls back to the
          tiered resolver (`vars.RUNNER_HEAVY` → default `self-hosted`). Pass
          a value to force a specific runner.
        type: string
        required: false
        default: ""

jobs:
  resolve-runner:
    uses: kethalia/workflows/.github/workflows/resolve-runner.yml@v3.1.0

  # -------------------------------------------------------------------------
  # Setup — split newline-separated charts input into JSON matrix
  # -------------------------------------------------------------------------
  setup:
    name: Setup Matrix
    runs-on: ${{ needs.resolve-runner.outputs.light }}
    needs: [resolve-runner]
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.charts == '' && inputs.chart-discovery-command != '' }}

      - id: build-matrix
        name: Build chart matrix
        env:
          CHARTS_INPUT: ${{ inputs.charts }}
          DISCOVERY_CMD: ${{ inputs.chart-discovery-command }}
        run: |
          set -euo pipefail
          if [ -n "$CHARTS_INPUT" ]; then
            raw="$CHARTS_INPUT"
            source="charts-input"
          elif [ -n "$DISCOVERY_CMD" ]; then
            echo "Running chart-discovery-command: $DISCOVERY_CMD"
            raw=$(bash -c "$DISCOVERY_CMD")
            source="discovery-command"
          else
            echo "::error::Neither 'charts' nor 'chart-discovery-command' was provided"
            exit 1
          fi
          # Normalize: strip trailing whitespace, drop blanks, reduce
          # */Chart.yaml entries to their parent directory.
          mapfile -t charts < <(
            printf '%s\n' "$raw" \
              | sed 's/[[:space:]]\+$//' \
              | grep -v '^[[:space:]]*$' \
              | sed 's|/Chart\.yaml$||'
          )
          if [ "${#charts[@]}" -eq 0 ]; then
            if [ "$source" = "charts-input" ]; then
              echo "::error::'charts' input contained no non-blank entries"
            else
              echo "::error::'chart-discovery-command' produced no paths"
            fi
            exit 1
          fi
          json="["
          for i in "${!charts[@]}"; do
            [ "$i" -gt 0 ] && json+=","
            json+=$(printf '%s' "${charts[$i]}" | jq -Rs .)
          done
          json+="]"
          echo "matrix=${json}" >> "$GITHUB_OUTPUT"
          echo "Resolved chart matrix: ${json}"

  # -------------------------------------------------------------------------
  # Lint + template each chart in parallel; fail-fast disabled so all charts
  # report independently and reviewers see every failure in one CI pass.
  # -------------------------------------------------------------------------
  lint:
    name: Helm Lint (${{ matrix.chart }})
    needs: [resolve-runner, setup]
    runs-on: ${{ inputs.runs-on != '' && inputs.runs-on || needs.resolve-runner.outputs.heavy }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ inputs.helm-version }}

      - name: Verify chart path exists
        run: |
          if [ ! -d "${{ matrix.chart }}" ]; then
            echo "::error::Chart path '${{ matrix.chart }}' does not exist in caller repo"
            exit 1
          fi
          if [ ! -f "${{ matrix.chart }}/Chart.yaml" ]; then
            echo "::error::No Chart.yaml at '${{ matrix.chart }}'"
            exit 1
          fi

      - name: Helm dependency update
        working-directory: ${{ matrix.chart }}
        run: helm dependency update

      - name: Helm lint
        working-directory: ${{ matrix.chart }}
        run: |
          if [ "${{ inputs.strict }}" = "true" ]; then
            helm lint --strict .
          else
            helm lint .
          fi

      - name: Helm template (render)
        run: |
          mkdir -p .helm-render
          chart_name=$(basename "${{ matrix.chart }}")
          helm template "$chart_name" "${{ matrix.chart }}" > ".helm-render/${chart_name}.yaml"
          echo "Rendered $(wc -l < ".helm-render/${chart_name}.yaml") lines for ${chart_name}"

      - name: Install kubeconform
        if: ${{ inputs.validate-templates }}
        env:
          KUBECONFORM_VERSION: ${{ inputs.kubeconform-version }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)   os=linux ;;
            macOS)   os=darwin ;;
            Windows) echo "kubeconform install on Windows runners is not supported by this reusable" >&2; exit 1 ;;
            *) echo "Unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
          esac
          case "$RUNNER_ARCH" in
            X64)   arch=amd64 ;;
            ARM64) arch=arm64 ;;
            *) echo "Unsupported runner arch: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          asset="kubeconform-${os}-${arch}.tar.gz"
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          tmp=$(mktemp -d)
          curl -fsSL -o "$tmp/$asset" "$base/$asset"
          curl -fsSL -o "$tmp/CHECKSUMS" "$base/CHECKSUMS"
          ( cd "$tmp" && grep " $asset\$" CHECKSUMS | sha256sum -c - )
          tar xz -C "$tmp" -f "$tmp/$asset" kubeconform
          sudo install -m 0755 "$tmp/kubeconform" /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate rendered templates (kubeconform)
        if: ${{ inputs.validate-templates }}
        env:
          K8S_VERSION: ${{ inputs.kubernetes-version }}
          SCHEMA_LOCATIONS: ${{ inputs.kubeconform-schema-locations }}
        run: |
          set -euo pipefail
          chart_name=$(basename "${{ matrix.chart }}")
          schema_args=()
          while IFS= read -r loc; do
            loc=$(printf '%s' "$loc" | sed 's/[[:space:]]\+$//')
            [ -z "$loc" ] && continue
            schema_args+=(-schema-location "$loc")
          done <<< "$SCHEMA_LOCATIONS"
          if [ "${#schema_args[@]}" -eq 0 ]; then
            echo "::error::kubeconform-schema-locations resolved to an empty list"
            exit 1
          fi
          kubeconform \
            -kubernetes-version "$K8S_VERSION" \
            -strict \
            -summary \
            "${schema_args[@]}" \
            ".helm-render/${chart_name}.yaml"

      - name: Compute artifact name
        id: artifact-name
        run: |
          # Replace path separators with dashes so artifact names are valid
          safe_name=$(printf '%s' "${{ matrix.chart }}" | tr '/' '-' | tr -cd '[:alnum:]-_.')
          echo "name=helm-render-${safe_name}" >> "$GITHUB_OUTPUT"

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: .helm-render/
          retention-days: 7
