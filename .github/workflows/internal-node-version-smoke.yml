name: Internal — Node version compatibility

on:
  pull_request:
    paths:
      - .github/workflows/ci-build-lint-test.yml
      - .github/workflows/ci-quality.yml
      - .github/workflows/internal-node-version-smoke.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  exact:
    uses: ./.github/workflows/ci-build-lint-test.yml
    with:
      node-version: 24
      node-version-spec: '22.23.4'
      build-command: node -e "require('node:assert/strict').equal(process.version, 'v22.23.4')"
      artifact-paths: .github/no-build-artifact

  legacy:
    uses: ./.github/workflows/ci-build-lint-test.yml
    with:
      node-version: 22
      build-command: node -e "require('node:assert/strict').match(process.version, /^v22\./)"
      artifact-paths: .github/no-build-artifact

  quality:
    uses: ./.github/workflows/ci-quality.yml
    with:
      node-version-spec: '22.23.4'
      changeset-check: true
      audit: false
