name: Reusable — Visual Regression Tests

# Reusable workflow that runs Playwright-based visual regression tests inside
# the pinned `mcr.microsoft.com/playwright` container.
#
# Topology: a single `visual-tests` job runs the suite (or refreshes baselines
# when `update-baselines: true`). Intended as a required branch-protection
# check on PRs.

on:
  workflow_call:
    inputs:
      playwright-image:
        description: |
          Container image to run the suite in (Playwright official image
          recommended). Must include bash — the reusable pins
          `defaults.run.shell: bash` so strict-mode prologues
          (`set -o pipefail`) work uniformly across steps.
        type: string
        required: false
        default: mcr.microsoft.com/playwright
      playwright-image-tag:
        description: |
          Image tag matching the @playwright/test version the repo uses
          (e.g. "v1.56.0-jammy"). Mismatching the SDK and image tag silently
          drifts renders — keep them in lockstep.
        type: string
        required: true
      browsers-path:
        description: |
          PLAYWRIGHT_BROWSERS_PATH for the image. The official Playwright
          containers ship browsers under /ms-playwright; override only if a
          custom image stores them elsewhere.
        type: string
        required: false
        default: /ms-playwright
      pnpm-version:
        description: pnpm version to activate via corepack.
        type: string
        required: false
        default: 9.15.9
      install-command:
        description: Dependency install command.
        type: string
        required: false
        default: pnpm install --frozen-lockfile
      test-command:
        description: |
          Command that runs the visual regression suite. Should produce an
          HTML report at the path under `report-paths` so the failure
          artifact upload has something to capture.
        type: string
        required: true
      report-paths:
        description: |
          Newline-separated paths to upload on failure (Playwright HTML report
          plus the per-test-results dir). Use the same multiline format
          `actions/upload-artifact` accepts. Paths are project-specific; the
          caller must supply them.
        type: string
        required: true
      screenshots-path:
        description: |
          Path (relative to repo root) where committed baseline PNGs live.
          Used by `update-baselines` mode to scope the refresh commit.
        type: string
        required: false
        default: packages/visual-tests/src/__screenshots__/
      timeout-minutes:
        description: Per-job timeout for the visual-tests run.
        type: number
        required: false
        default: 30
      artifact-retention-days:
        description: Retention for the failure-artifact upload.
        type: number
        required: false
        default: 14
      update-baselines:
        description: |
          When true, run `update-command` instead of `test-command`, then
          commit any regenerated files under `screenshots-path` back to the
          source branch.

          Intended to be wired to a `workflow_dispatch` trigger in the caller
          so a maintainer can refresh baselines from the same container CI
          uses for verification — eliminating local/CI environment drift.
        type: boolean
        required: false
        default: false
      update-command:
        description: |
          Command that regenerates baseline screenshots (e.g. one that adds
          `--update-snapshots` to the Playwright run). Required when
          `update-baselines` is true; ignored otherwise.
        type: string
        required: false
        default: ''
      update-commit-message:
        description: Commit message used when `update-baselines` produces changes.
        type: string
        required: false
        default: "chore(visual-tests): refresh baselines from CI"
      git-user-name:
        description: |
          DEPRECATED. Baseline-refresh commits are now created via the
          GitHub API and authored as `github-actions[bot]` so they are
          signed by GitHub's web-flow key. This input is accepted for caller
          backwards-compatibility and ignored.
        type: string
        required: false
        default: github-actions[bot]
      git-user-email:
        description: |
          DEPRECATED. See `git-user-name` — author is fixed to
          `github-actions[bot]` for web-flow signing. Ignored.
        type: string
        required: false
        default: 41898282+github-actions[bot]@users.noreply.github.com

concurrency:
  group: visual-tests-${{ github.workflow }}-${{ github.ref }}
  # Do not cancel in-flight runs when updating baselines — the run pushes a
  # new commit that would otherwise interrupt itself.
  cancel-in-progress: ${{ !inputs.update-baselines }}

jobs:
  resolve-runner:
    uses: kethalia/workflows/.github/workflows/resolve-runner.yml@v3.2.0

  visual-tests:
    needs: [resolve-runner]
    # Heavy tier: the suite runs Playwright in a container and is CPU/IO-bound.
    # Resolution follows `resolve-runner.yml` — `vars.RUNNER_HEAVY` on the
    # caller repo (or org-level default) selects the label; falls back to
    # `self-hosted`. Self-hosted runners consuming this workflow must have
    # Docker available and be able to pull the Playwright image, since the
    # job runs inside `container:`.
    runs-on: ${{ needs.resolve-runner.outputs.heavy }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # No `permissions:` block here. GitHub Actions does NOT evaluate
    # expressions in `jobs.<id>.permissions`, and declaring a static
    # `contents: write` on a reusable would exceed the token scope of
    # test-only callers that grant only `contents: read`, producing a
    # startup_failure. Callers that need `update-baselines: true` must
    # grant `contents: write` on the calling job (or workflow)
    # `permissions:` — the reusable then inherits that elevated scope.
    container:
      image: ${{ inputs.playwright-image }}:${{ inputs.playwright-image-tag }}
      options: --ipc=host
    # The default container shell is `sh` (dash), which rejects `set -o pipefail`.
    # Pin every inline step to bash so the strict-mode prologue works uniformly.
    # The playwright-jammy image ships bash.
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ inputs.browsers-path }}
    steps:
      - name: Validate inputs
        if: inputs.update-baselines && inputs.update-command == ''
        run: |
          echo "::error::update-baselines=true requires update-command to be set."
          exit 1

      - name: Guard refresh-mode ref is a branch
        if: inputs.update-baselines
        env:
          REF: ${{ github.ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # In refresh mode we push a commit back; that requires a real branch
          # ref. workflow_dispatch against a tag (or any non-branch ref with no
          # head_ref) produces a detached HEAD that `git push` cannot resolve.
          if [ -n "${HEAD_REF}" ]; then
            echo "refresh target: ${HEAD_REF} (PR head)"
            exit 0
          fi
          case "${REF}" in
            refs/heads/*)
              echo "refresh target: ${REF}"
              ;;
            *)
              echo "::error::update-baselines requires a branch ref. Got '${REF}'."
              echo "Trigger this workflow from a branch (workflow_dispatch on a branch, or pull_request)."
              exit 1
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out the actual branch tip (not the detached merge SHA) so
          # the baseline-refresh commit can be pushed back.
          ref: ${{ inputs.update-baselines && (github.head_ref || github.ref_name) || github.ref }}

      - name: Enable corepack and activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ inputs.pnpm-version }} --activate

      - name: Compute pnpm store directory
        id: pnpm-cache
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: ${{ inputs.install-command }}

      - name: Run visual tests
        if: ${{ !inputs.update-baselines }}
        run: ${{ inputs.test-command }}

      - name: Refresh visual baselines
        if: inputs.update-baselines
        run: ${{ inputs.update-command }}

      # Use GitHub's GraphQL `createCommitOnBranch` mutation rather than
      # `git commit` + `git push` so the resulting commit is signed by
      # GitHub's web-flow key and appears as a verified
      # `github-actions[bot]` commit. Local `git commit` from the runner
      # produces unsigned commits that fail branch protection rules
      # requiring signed commits.
      - name: Commit refreshed baselines (signed via GitHub API)
        if: inputs.update-baselines
        uses: actions/github-script@v7
        env:
          SCREENSHOTS_PATH: ${{ inputs.screenshots-path }}
          COMMIT_MESSAGE: ${{ inputs.update-commit-message }}
          # `github.head_ref` is set on pull_request events; otherwise
          # `github.ref_name` carries the branch from workflow_dispatch.
          # Mirrors the `actions/checkout` ref selection above.
          TARGET_REF: ${{ github.head_ref || github.ref_name }}
        with:
          script: |
            const { execSync } = require('node:child_process');
            const fs = require('node:fs');
            const path = require('node:path');

            const screenshotsPath = process.env.SCREENSHOTS_PATH;
            const commitMessage = process.env.COMMIT_MESSAGE;
            const targetRef = process.env.TARGET_REF;
            const { owner, repo } = context.repo;

            // `actions/checkout` marks the workspace as unsafe for `git` when
            // run inside a container with a different uid than the repo owner.
            execSync(
              `git config --global --add safe.directory "${process.env.GITHUB_WORKSPACE}"`,
              { stdio: 'inherit' },
            );
            // -A so deleted/renamed baselines are staged too — otherwise stale
            // PNGs would accumulate after a component is removed or renamed.
            execSync(`git add -A -- "${screenshotsPath}"`, { stdio: 'inherit' });

            // --name-status -z output: each entry is "<status>\0<path>\0",
            // except R/C which is "<status>\0<from>\0<to>\0". Raise maxBuffer
            // well above the 1 MiB default — large baseline refreshes can
            // produce tens of KB of path data, and we'd rather not silently
            // truncate before committing.
            const buf = execSync('git diff --cached --name-status -z', {
              maxBuffer: 256 * 1024 * 1024,
            });
            if (buf.length === 0) {
              core.info('No baseline changes — branch already in sync with CI renders.');
              return;
            }
            const tokens = [];
            let start = 0;
            for (let i = 0; i < buf.length; i++) {
              if (buf[i] === 0) {
                tokens.push(buf.subarray(start, i).toString('utf8'));
                start = i + 1;
              }
            }

            const entries = [];
            for (let i = 0; i < tokens.length; ) {
              const status = tokens[i++];
              const code = status[0];
              if (code === 'R' || code === 'C') {
                const from = tokens[i++];
                const to = tokens[i++];
                // Model rename/copy as delete-old + add-new at the API level.
                if (code === 'R') {
                  entries.push({ op: 'delete', path: from });
                }
                entries.push({ op: 'upsert', path: to });
              } else if (code === 'D') {
                entries.push({ op: 'delete', path: tokens[i++] });
              } else {
                // A, M, T (type-change) — treat as upsert.
                entries.push({ op: 'upsert', path: tokens[i++] });
              }
            }

            if (entries.length === 0) {
              core.info('No baseline changes — branch already in sync with CI renders.');
              return;
            }

            const { data: refData } = await github.rest.git.getRef({
              owner, repo, ref: `heads/${targetRef}`,
            });
            const expectedHeadOid = refData.object.sha;

            // GraphQL `createCommitOnBranch` accepts all additions+deletions in
            // a single mutation and produces a web-flow-signed commit attributed
            // to `github-actions[bot]` when called with GITHUB_TOKEN. Replaces
            // the prior runner-side `git commit` + `git push`, which produced
            // an unsigned commit that branch-protection rejected as unverified.
            // One round-trip regardless of file count avoids secondary rate
            // limits on baseline refreshes that touch many PNGs.
            const additions = [];
            const deletions = [];
            for (const entry of entries) {
              if (entry.op === 'delete') {
                deletions.push({ path: entry.path });
                continue;
              }
              const abs = path.join(process.env.GITHUB_WORKSPACE, entry.path);
              const contents = fs.readFileSync(abs);
              additions.push({
                path: entry.path,
                contents: contents.toString('base64'),
              });
            }

            const mutation = `
              mutation($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) {
                  commit { oid url }
                }
              }
            `;
            const result = await github.graphql(mutation, {
              input: {
                branch: {
                  repositoryNameWithOwner: `${owner}/${repo}`,
                  branchName: targetRef,
                },
                expectedHeadOid,
                message: { headline: commitMessage },
                fileChanges: { additions, deletions },
              },
            });

            const newOid = result.createCommitOnBranch.commit.oid;
            core.info(
              `Pushed signed commit ${newOid} to ${targetRef} ` +
              `(${additions.length} added, ${deletions.length} deleted).`,
            );

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ inputs.report-paths }}
          retention-days: ${{ inputs.artifact-retention-days }}
          compression-level: 6
          if-no-files-found: ignore
